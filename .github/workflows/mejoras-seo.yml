name: "Mejoras SEO puntuales (manual)"
on:
  workflow_dispatch:
    inputs:
      script:
        description: "script a correr (en scripts/)"
        default: "h1-portada-2026-10-15.js"
      modo:
        description: "MODO (según el script: respaldo / una / aplicar ...)"
        default: "respaldo"
      solo:
        description: "SOLO (id para pruebas de un elemento)"
        default: ""
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/${{ inputs.script }}
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PROXY_SECRET: ${{ secrets.PROXY_SECRET }}
          LABLAB_WP_USER: ${{ secrets.LABLAB_WP_USER }}
          LABLAB_WP_APP_PASSWORD: ${{ secrets.LABLAB_WP_APP_PASSWORD }}
          MODO: ${{ inputs.modo }}
          SOLO: ${{ inputs.solo }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: respaldos
          path: respaldo-*.json
          if-no-files-found: ignore
