name: "Mejoras SEO puntuales (manual)"
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/mejoras-seo-2026-09-30.js
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PROXY_SECRET: ${{ secrets.PROXY_SECRET }}
          LABLAB_WP_USER: ${{ secrets.LABLAB_WP_USER }}
          LABLAB_WP_APP_PASSWORD: ${{ secrets.LABLAB_WP_APP_PASSWORD }}
